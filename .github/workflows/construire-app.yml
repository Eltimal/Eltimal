# Construit l'app Mac (Apple Silicon et Intel), à la demande (Actions > Construire l'app > Run workflow).
#  - Avec les secrets de signature (MAC_CERT_P12, MAC_CERT_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER) :
#    app signée « Developer ID », notarisée par Apple, vérifiée (codesign, spctl). C'est la seule forme distribuable.
#  - Sans ces secrets : app signée localement (ad hoc), pour les essais ; refusée sur la branche main (canal stable).
# L'app ne contient aucune clé d'accès. Si electron/maj-cle-publique.pem est commité, elle refuse toute mise à jour dont le
# manifeste n'est pas signé (voir electron/cles-maj.js). Canal de l'app : stable depuis main, essai depuis une autre branche.
# Sortie : publication « app » (main) ou « app-essai » (autres branches), pièces La-Permanence-mac-arm64.zip et -x64.zip.
name: Construire l'app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Module de mise à jour (canaux, signature)
        run: npm run test:maj:module
      - name: Construire
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node electron/paquet-jeu.js --version-livree
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/cle-apple.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/cle-apple.p8"
            npx electron-builder --mac zip --arm64 --x64 --publish never -c.mac.notarize=true
            echo "SIGNEE=oui" >> "$GITHUB_ENV"
          else
            if [ "$GITHUB_REF_NAME" = "main" ]; then echo "::error::Une app du canal stable doit être signée et notarisée : secrets de signature absents."; exit 1; fi
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac zip --arm64 --x64 --publish never -c.mac.identity=-
            echo "SIGNEE=non" >> "$GITHUB_ENV"
          fi
          rm -f "$RUNNER_TEMP/cle-apple.p8"
          ls dist
          cp dist/*-arm64-mac.zip La-Permanence-mac-arm64.zip
          cp "$(ls dist/*-mac.zip | grep -v arm64 | head -1)" La-Permanence-mac-x64.zip
      - name: Vérifier la signature et la notarisation
        if: env.SIGNEE == 'oui'
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/La Permanence.app"
          spctl --assess --type execute --verbose=2 "dist/mac-arm64/La Permanence.app"
          xcrun stapler validate "dist/mac-arm64/La Permanence.app"
      - name: L'app construite se lance, sans réseau, et garde ses sauvegardes
        env:
          APP: dist/mac-arm64/La Permanence.app/Contents/MacOS/La Permanence
        run: npm run test:app
      - uses: actions/upload-artifact@v4
        with:
          name: La-Permanence-mac
          path: La-Permanence-mac-*.zip
          retention-days: 7
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(node -p "require('./electron/jeu-version.json').numero")
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=app; TITRE="App Mac (jeu n° $N)"; PRE=""; else TAG=app-essai; TITRE="App Mac d'essai (jeu n° $N, $GITHUB_REF_NAME)"; PRE="--prerelease"; fi
          NOTE="Installer une fois. Le jeu se met ensuite à jour tout seul au lancement."
          if [ "$SIGNEE" != "oui" ]; then NOTE="$NOTE App d'essai, non notarisée : au premier lancement, clic droit sur l'app puis Ouvrir."; fi
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" La-Permanence-mac-arm64.zip La-Permanence-mac-x64.zip --title "$TITRE" --notes "$NOTE" --target "$GITHUB_SHA" --latest=false $PRE
