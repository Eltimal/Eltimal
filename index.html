<title>La Permanence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Polices embarquées : le jeu fonctionne sans réseau. */
@font-face { font-family: "Source Sans 3"; font-weight: 400; font-style: normal; font-display: swap; src: url(fonts/source-sans-3-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-weight: 400; font-style: italic; font-display: swap; src: url(fonts/source-sans-3-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-weight: 600; font-style: normal; font-display: swap; src: url(fonts/source-sans-3-latin-600-normal.woff2) format("woff2"); }

@font-face { font-family: "Spectral"; font-weight: 400; font-style: normal; font-display: swap; src: url(fonts/spectral-latin-400-normal.woff2) format("woff2"); }

@font-face { font-family: "Spectral"; font-weight: 600; font-style: normal; font-display: swap; src: url(fonts/spectral-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 700; font-style: normal; font-display: swap; src: url(fonts/spectral-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Courier Prime"; font-weight: 400; font-style: normal; font-display: swap; src: url(fonts/courier-prime-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Courier Prime"; font-weight: 700; font-style: normal; font-display: swap; src: url(fonts/courier-prime-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Silkscreen"; font-weight: 400; font-style: normal; font-display: swap; src: url(fonts/silkscreen-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Silkscreen"; font-weight: 700; font-style: normal; font-display: swap; src: url(fonts/silkscreen-latin-700-normal.woff2) format("woff2"); }

@font-face { font-family: "Caveat"; font-weight: 700; font-style: normal; font-display: swap; src: url(fonts/caveat-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Bodoni Moda"; font-weight: 500; font-style: normal; font-display: swap; src: url(fonts/bodoni-moda-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Bodoni Moda"; font-weight: 700; font-style: normal; font-display: swap; src: url(fonts/bodoni-moda-latin-700-normal.woff2) format("woff2"); }
/* Parti pris : une nuit de permanence à Paris. Bleu nuit des couloirs du tribunal, ambre des réverbères au sodium,
   papier crème des procès-verbaux et carnet à grands carreaux Seyès. Un seul monde, sombre, assumé. */
:root {
  color-scheme: dark;
  --bg: #0e1320;
  --bg2: #151c2c;
  --bg3: #1d2639;
  --bg4: #263147;
  --line: #2c3850;
  --line2: #3b4a68;
  --fg: #e8e4da;
  --muted: #a3a9b8;
  --dim: #737b8e;
  --amber: #e2a43b;
  --amber-2: #f3c166;
  --amber-ink: #1d1406;
  --paper: #f6f2e7;
  --paper-2: #e7e1d1;
  --ink: #1d1d22;
  --ink-2: #565a63;
  --pv: #eef0f2;
  --seyes: #fbfaf6;
  --seyes-v: #c8b8e4;
  --seyes-h: #ddd2f0;
  --seyes-margin: #e07a7a;
  --seyes-ink: #1f3478;
  --ok: #7cc49a;
  --warn: #eab04e;
  --bad: #ec7363;
  --link: #93b6ec;
  --bleu: #27407a;
  --rouge: #b3261e;
  --f-ui: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-title: "Bodoni Moda", "Didot", Georgia, serif;
  --f-doc: "Spectral", Georgia, "Times New Roman", serif;
  --f-mono: "Courier Prime", "Courier New", monospace;
  --f-pix: "Silkscreen", "Courier New", monospace;
  --f-hand: "Caveat", "Segoe Print", cursive;
  --tz: 1;
  --r: 6px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
html { font-size: calc(16px * var(--tz)); }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: calc(16px * var(--tz))/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
#app { min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line2); border-radius: var(--r); padding: 8px 10px; min-width: 0; }
input[type="range"] { padding: 0; accent-color: var(--amber); }
input[type="checkbox"] { accent-color: var(--amber); margin-top: 4px; flex: none; }
:focus-visible { outline: 2px solid var(--amber-2); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
h2 { font: 700 1.4rem/1.2 var(--f-title); }
h3 { font: 700 1.02rem/1.3 var(--f-ui); }
h4 { font: 700 1rem/1.3 var(--f-doc); color: var(--amber-2); margin-bottom: 8px; }
p { margin: 0 0 .6em; }
.pix { font-family: var(--f-pix); font-size: calc(10px * var(--tz)); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.small { font-size: .84rem; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.neg { color: var(--bad); }
.link { background: none; border: 0; color: var(--link); padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.ico { flex: none; vertical-align: -3px; }
.flip svg { transform: scaleX(-1); }
.warn-txt { color: var(--warn); }

/* ---------- boutons, étiquettes ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--bg3); border: 1px solid var(--line2); border-radius: var(--r); padding: 8px 14px; font-weight: 600; font-size: .92rem; transition: background .12s, border-color .12s; }
.btn:hover:not(:disabled) { background: var(--bg4); border-color: #4c5d80; }
.btn:disabled { opacity: .45; }
.btn-primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber-2); }
.btn-primary:hover:not(:disabled) { background: var(--amber-2); }
.btn-danger { background: #7c2a22; border-color: #a73e30; color: #fff1ec; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover:not(:disabled) { border-color: var(--line2); }
.btn-sm { padding: 5px 10px; font-size: .82rem; }
.icon-btn { background: transparent; border: 1px solid transparent; border-radius: var(--r); padding: 6px; display: inline-flex; color: var(--fg); }
.icon-btn:hover { background: var(--bg3); border-color: var(--line); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line2); color: var(--muted); background: var(--bg); white-space: nowrap; }
.tag-ok { color: var(--ok); border-color: #2f5a44; }
.tag-warn { color: var(--warn); border-color: #6b5120; }
.tag-bad { color: var(--bad); border-color: #6e3328; }
.tag-brass { color: var(--amber-2); border-color: #6b5326; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--bg2); border: 1px solid var(--line2); border-radius: 99px; padding: 4px 12px; font-size: .84rem; color: var(--muted); }
.chip:hover { color: var(--fg); }
.chip.on { color: var(--amber-ink); background: var(--amber); border-color: var(--amber-2); }
.banner { border: 1px solid var(--line2); background: var(--bg3); border-radius: var(--r); padding: 10px 14px; margin: 0 0 12px; }
.banner.ok { border-color: #2f5a44; background: #14251e; }
.banner.warn { border-color: #6b5120; background: #2a2113; }
.banner.bad { border-color: #6e3328; background: #2b1614; }
.empty { color: var(--dim); font-style: italic; padding: 10px 2px; list-style: none; }

/* ---------- jauges ---------- */
.meter { position: relative; height: 8px; min-width: 70px; background: #070a12; border: 1px solid var(--line2); border-radius: 2px; overflow: hidden; }
.meter-sm { height: 5px; min-width: 40px; }
.meter-fill { position: absolute; inset: 0 auto 0 0; background: var(--amber); transition: width .4s; }
.tone-ok .meter-fill { background: var(--ok); }
.tone-warn .meter-fill { background: var(--warn); }
.tone-bad .meter-fill { background: var(--bad); }

/* ---------- en-tête ---------- */
.game { min-height: 100vh; display: flex; flex-direction: column; }
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 10px; padding-left: var(--gut); padding-right: var(--gut-r); background: #090d17; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #090d17; }
.hud-brand { display: flex; flex-direction: column; min-width: 0; }
.hud-firm { font: 700 1.08rem/1.1 var(--f-title); color: var(--amber-2); }
.hud-name { font-size: .8rem; color: var(--muted); }
.hud-clock { display: flex; flex-direction: column; gap: 2px; }
.hud-time { font: 700 1.05rem/1 var(--f-mono); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hud-stat { display: flex; flex-direction: column; gap: 3px; min-width: 110px; background: none; border: 0; padding: 0; text-align: left; }
.hud-stat .lbl { display: flex; align-items: center; gap: 4px; }
.hud-place { font-size: .86rem; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-sub { font-size: .76rem; color: var(--muted); }
.hud-money .num { font: 700 1.05rem/1 var(--f-mono); }
.hud-reps { display: grid; grid-template-columns: repeat(2, auto); gap: 3px 12px; background: none; border: 0; padding: 0; }
.rep-mini { display: flex; align-items: center; gap: 6px; }
.rep-mini .pix { width: 66px; font-size: calc(9px * var(--tz)); }
.hud-menu { margin-left: auto; }

/* ---------- décor ---------- */
.stage { position: relative; display: flex; justify-content: center; background: radial-gradient(ellipse at center, #1c2640 0%, #080b13 78%); border-bottom: 1px solid var(--line); overflow: hidden; }
.scene-canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 8 / 3; width: 100%; height: auto; max-width: 100%; }
.pano { display: block; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }
.stage-label { position: absolute; left: var(--gut); bottom: 8px; color: #e4dcc8; text-shadow: 0 1px 0 #000; }
.is-night .stage { background: radial-gradient(ellipse at center, #121a30 0%, #04060b 78%); }
.ringbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; padding-left: var(--gut); padding-right: var(--gut-r); background: #2b2112; border-bottom: 1px solid #6b5326; animation: ring 1.2s ease-in-out infinite; }
@keyframes ring { 0%, 100% { background: #2b2112; } 50% { background: #3d2d15; } }
.ring-txt { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
.portrait { image-rendering: pixelated; border-radius: 4px; background: #000; flex: none; display: block; }

/* ---------- mise en page ---------- */
.main { flex: 1; display: grid; grid-template-columns: 184px minmax(0, 1fr); }
.rail { display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; border-right: 1px solid var(--line); background: var(--bg); position: sticky; top: 64px; align-self: start; }
.rail-btn { position: relative; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: var(--r); padding: 9px 10px; color: var(--muted); text-align: left; font-weight: 600; }
.rail-btn:hover { background: var(--bg2); color: var(--fg); }
.rail-btn.on { background: var(--bg3); color: var(--amber-2); }
.badge { margin-left: auto; background: var(--bad); color: #fff; font-size: .7rem; border-radius: 99px; padding: 0 7px; line-height: 18px; font-style: normal; }
.panel-host { min-width: 0; padding-block: 18px 40px; padding-left: 20px; padding-right: var(--gut-r); }
.panel { min-width: 0; }
.sec { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sec-head h3 { font-family: var(--f-pix); font-size: calc(11px * var(--tz)); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); font-weight: 400; }
.sub-head { font-size: .78rem; color: var(--dim); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .06em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.grid2 > * { margin-bottom: 0; min-width: 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tab.on { color: var(--amber-2); border-bottom-color: var(--amber); }

/* ---------- conseils du mentor ---------- */
.coach { display: flex; gap: 12px; align-items: flex-start; background: #1a2135; border: 1px solid #3d4a6c; border-left: 3px solid var(--amber); border-radius: var(--r); padding: 10px 12px; margin-bottom: 14px; }
.coach-body { min-width: 0; flex: 1; }
.coach-body p { font: italic 400 .98rem/1.5 var(--f-doc); color: #e9e2d0; margin: 4px 0 8px; }
.coach-btns { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* ---------- bureau ---------- */
.today-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
.today-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.today .grid2 { margin-bottom: 14px; }
.agenda-row { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.agenda-row:last-child { border-bottom: 0; }
.agenda-row.soon .agenda-date .pix { color: var(--warn); }
.agenda-row.past { opacity: .6; }
.agenda-date { display: flex; flex-direction: column; }
.agenda-txt { display: flex; flex-direction: column; min-width: 0; align-items: flex-start; }
.agenda-left { color: var(--muted); font-variant-numeric: tabular-nums; }
.court-call { display: flex; gap: 10px; align-items: center; padding: 10px; background: #2a2113; border: 1px solid #6b5120; border-radius: var(--r); margin-bottom: 8px; flex-wrap: wrap; }
.court-call > div { flex: 1; min-width: 160px; }
.matter-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.matter { display: flex; align-items: center; gap: 10px; background: var(--bg3); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; text-align: left; min-width: 0; }
.matter:hover { border-color: #4c5d80; }
.matter-txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.matter-txt strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mood { font-size: .74rem; padding: 2px 7px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
.mood.ok { color: var(--ok); } .mood.warn { color: var(--warn); } .mood.bad { color: var(--bad); }
.inbox-glance { display: flex; gap: 8px; flex-wrap: wrap; }
.glance { display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; }
.glance.bad { color: var(--bad); border-color: #6e3328; }

/* ---------- messagerie ---------- */
.split { display: grid; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.list-pane, .read-pane { min-width: 0; }
.mail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 70vh; overflow-y: auto; }
.mail { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "kind from date" "subj subj subj"; gap: 2px 8px; text-align: left; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.mail.unread { border-left: 3px solid var(--amber); }
.mail.unread .mail-subj { color: var(--fg); font-weight: 700; }
.mail.important.unread { border-left-color: var(--bad); }
.mail.on { background: var(--bg3); border-color: #4c5d80; }
.mail-from { grid-area: from; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-subj { grid-area: subj; color: var(--muted); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-date { grid-area: date; color: var(--dim); }
.kind { grid-area: kind; font: 400 calc(9px * var(--tz))/1 var(--f-pix); letter-spacing: .06em; padding: 3px 5px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line2); color: var(--muted); align-self: center; }
.k-greffe { color: #9fc0f0; border-color: #2e4a72; }
.k-ordre { color: #e7a3e0; border-color: #5d3360; }
.k-courrier { color: var(--amber-2); border-color: #6b5326; }
.k-pv { color: #c9cfda; border-color: #4a5268; }
.k-presse, .k-sms { color: #9fd0ae; border-color: #2f5a44; }
.k-note { color: #c8b8e4; border-color: #4f4173; }
.reader { min-width: 0; }
.reader-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 8px; }
.reader-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.reader-subj { font: 700 1.15rem/1.3 var(--f-doc); margin-bottom: 10px; }
.docview { position: relative; min-width: 0; }
.pop { position: absolute; z-index: 15; display: flex; flex-direction: column; background: var(--bg3); border: 1px solid #4c5d80; border-radius: var(--r); box-shadow: 0 8px 24px rgba(0,0,0,.55); overflow: hidden; min-width: 230px; max-width: calc(100vw - 40px); }
.pop button { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 9px 12px; text-align: left; font-size: .9rem; }
.pop button:hover { background: var(--bg4); }

/* ---------- pièces ---------- */
.paper { background: var(--paper); color: var(--ink); font: 400 1rem/1.65 var(--f-doc); padding: 28px clamp(18px, 4vw, 44px); border-radius: 2px; box-shadow: 0 1px 0 #cfc7b4, 0 10px 30px rgba(0,0,0,.5); max-width: 780px; position: relative; overflow-wrap: anywhere; }
.paper p { margin: 0 0 .85em; }
.paper-title { font: 700 1.04rem/1.3 var(--f-doc); text-transform: uppercase; letter-spacing: .05em; text-align: center; margin-bottom: 16px; color: var(--ink); }
.paper-to { font-style: italic; color: var(--ink-2); }
.paper-sign { margin-top: 18px; font-style: italic; color: var(--ink-2); }
.paper-entete { font: 600 .82rem/1.35 var(--f-ui); color: var(--bleu); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 16px; border-left: 4px solid var(--bleu); padding-left: 10px; }
.paper-pv { background: var(--pv); font-family: var(--f-mono); font-size: .93rem; border-top: 6px solid var(--bleu); }
.paper-greffe { border-top: 6px solid var(--bleu); }
.paper-acte { border-top: 6px solid #6b1f1f; }
.paper-courrier, .paper-email { font-family: var(--f-doc); }
.paper-sms, .paper-presse { font-family: var(--f-ui); }
.paper-ordre { border-top: 6px solid #5d3360; }
.paper-out { border-left: 6px solid #3c5f9c; }
.paper-note { background: var(--seyes); color: var(--seyes-ink); font: 500 1.25rem/32px var(--f-hand); background-image: linear-gradient(to right, transparent 46px, var(--seyes-margin) 46px, var(--seyes-margin) 47px, transparent 47px), repeating-linear-gradient(to bottom, transparent 0 31px, var(--seyes-v) 31px 32px), repeating-linear-gradient(to bottom, transparent 0 7px, var(--seyes-h) 7px 8px); padding-left: 60px; }
.paper-note .paper-title { font: 700 1.4rem/32px var(--f-hand); color: var(--seyes-ink); text-transform: none; letter-spacing: 0; text-align: left; margin-bottom: 0; }
.paper-note p { margin-bottom: 0; }
.paper-compact { padding: 16px 20px; }
.tampon { position: absolute; right: 24px; top: 20px; transform: rotate(-8deg); border: 3px double var(--rouge); color: var(--rouge); font: 700 .8rem/1.2 var(--f-mono); padding: 4px 8px; text-transform: uppercase; opacity: .78; }
.caption { margin-bottom: 18px; font-family: var(--f-doc); }
.cap-court { text-align: left; font-weight: 700; white-space: pre-line; font-size: .9rem; margin-bottom: 8px; }
.cap-box { display: grid; grid-template-columns: 1.4fr 1fr; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.cap-left { white-space: pre-wrap; padding: 10px 12px 10px 0; border-right: 1px solid var(--ink); font-size: .9rem; }
.cap-right { white-space: pre-line; padding: 10px 0 10px 14px; font-size: .9rem; font-weight: 700; }
.seg { cursor: pointer; border-radius: 2px; transition: background .1s; }
.seg:hover, .seg:focus-visible { background: rgba(226,164,59,.25); outline: none; }
.seg-noted { background: rgba(200,184,228,.6); box-shadow: 0 0 0 1px rgba(120,90,170,.3); }
.seg-flagged { text-decoration: underline wavy var(--rouge); text-underline-offset: 3px; }

/* ---------- carnet à grands carreaux (Seyès) ---------- */
.carnet { background: var(--seyes); color: var(--seyes-ink); border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.45); overflow: hidden; width: 100%; }
.carnet-top { background: #2b3d6e; color: #eef0fa; font: 400 calc(10px * var(--tz))/1 var(--f-pix); letter-spacing: .1em; text-transform: uppercase; padding: 9px 12px; display: flex; justify-content: space-between; }
.carnet-count { opacity: .8; }
.carnet-lines { list-style: none; margin: 0; padding: 0 10px 8px 40px; background-image: linear-gradient(to right, transparent 30px, var(--seyes-margin) 30px, var(--seyes-margin) 31px, transparent 31px), repeating-linear-gradient(to bottom, transparent 0 31px, var(--seyes-v) 31px 32px), repeating-linear-gradient(to bottom, transparent 0 7px, var(--seyes-h) 7px 8px); max-height: 46vh; overflow-y: auto; }
.carnet-line { font: 500 1.16rem/32px var(--f-hand); position: relative; padding-right: 4px; }
.carnet-src { position: absolute; left: -30px; width: 22px; text-align: center; color: #7a5aa8; font: .8rem/32px var(--f-ui); }
.carnet-pick { cursor: pointer; }
.carnet-pick:hover { background: rgba(39,64,122,.08); }
.carnet-sel { background: rgba(39,64,122,.16); }
.carnet-empty { font: 500 1.1rem/32px var(--f-hand); color: #7c7aa0; }

/* ---------- dossiers ---------- */
.case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.case-card { display: flex; flex-direction: column; gap: 10px; text-align: left; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.case-card:hover { border-color: #4c5d80; background: var(--bg3); }
.case-card-top { display: flex; gap: 10px; align-items: center; min-width: 0; }
.case-card-top > div { display: flex; flex-direction: column; min-width: 0; }
.case-card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cf-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 14px; }
.cf-title { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
.cf-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.code-aff { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.code-aff code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: rgba(127,127,127,.15); }
.code-box input[type=text] { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; width: 100%; }
.code-apercu { margin: 8px 0; padding: 8px 10px; border-radius: 6px; background: rgba(127,127,127,.1); }
.code-apercu p { margin: 2px 0; }
.code-camps { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
.code-crit { margin: 10px 0; }
.code-crit .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
.code-crit select { width: 100%; }
.cf-trust { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
.tasks { display: flex; flex-direction: column; gap: 6px; }
.task { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; width: 100%; }
.task:hover:not(:disabled) { background: var(--bg3); border-color: #4c5d80; }
.task.urgent { border-color: #6b5120; background: #221c12; }
.task.danger strong { color: #f0a594; }
.task.off { opacity: .45; }
.task-ico { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: var(--bg); border-radius: 50%; color: var(--amber); }
.task-txt { display: flex; flex-direction: column; min-width: 0; }
.task-where { color: var(--link); display: flex; align-items: center; gap: 4px; }
.task-time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cf-money { margin-top: 10px; }
.doc-list, .issue-list, .timeline, .log-list, .agenda-list, .vm-list, .contact-list, .staff-list, .save-list, .lib-list, .deb-list { list-style: none; margin: 0; padding: 0; }
.doc-row { width: 100%; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; text-align: left; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; margin-bottom: 4px; }
.doc-row:hover { background: var(--bg3); }
.dir { font: 400 calc(9px * var(--tz))/1.8 var(--f-pix); text-transform: uppercase; color: var(--muted); }
.dir.out { color: var(--link); }
.issue-list li, .timeline li, .log-list li { padding: 7px 0; border-bottom: 1px dashed var(--line); }
.lk-bad { color: #f2b4a8; } .lk-good { color: #b4dfc4; }
.proc .tbl td:first-child { width: 160px; }

/* ---------- agenda ---------- */
.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-head h2 { min-width: 200px; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-bottom: 16px; }
.cal-dow { text-align: center; padding: 4px; }
.cal-cell { min-height: 84px; background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 5px; text-align: left; display: flex; flex-direction: column; gap: 2px; overflow: hidden; min-width: 0; }
.cal-cell.blank { background: transparent; border-color: transparent; }
.cal-cell.off { background: #10151f; }
.cal-cell.past { opacity: .55; }
.cal-cell.today { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.cal-num { font: 700 .82rem/1 var(--f-mono); color: var(--muted); }
.cal-hol { font-size: .62rem; color: var(--amber); line-height: 1.1; }
.cal-ev { font-size: .68rem; background: #2c3f6a; color: #dfe8f8; border-radius: 3px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-more { font-size: .65rem; color: var(--muted); }
.agenda-list li { padding: 6px 0; border-bottom: 1px dashed var(--line); }

/* ---------- carte ---------- */
.carte-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 1100px) { .carte-grid { grid-template-columns: minmax(0, max(560px, calc((100vh - 336px) * 1.43))) minmax(300px, 1fr); } .carte-side { position: sticky; top: 12px; } }
.carte-side { min-width: 0; }
.map-wrap { min-width: 0; }
.map { position: relative; width: 100%; aspect-ratio: 480 / 336; max-width: 100%; background: #05070e; border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 0 2px #05070e, 0 0 0 4px #3b4a68, 0 0 0 6px #05070e, 0 18px 40px -18px rgba(0,0,0,.8); }
.map.map-jour { box-shadow: 0 0 0 2px #05070e, 0 0 0 4px #8a7a55, 0 0 0 6px #05070e, 0 18px 40px -18px rgba(0,0,0,.8); }
.map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: auto; display: block; }
.map-hud { position: absolute; left: 1.6%; top: 2.2%; display: flex; flex-direction: column; gap: 2px; padding: 6px 9px 7px; background: rgba(5,7,14,.72);
  box-shadow: inset 0 0 0 1px rgba(226,193,113,.35); font-family: "Silkscreen", var(--f-mono); pointer-events: none; z-index: 3; }
.mh-t { font-size: .92rem; font-weight: 700; letter-spacing: .14em; color: #f3dca0; line-height: 1; }
.mh-s { font-size: .62rem; letter-spacing: .1em; color: #b9c0d8; line-height: 1.2; }
.mp-hit { position: absolute; width: 3.6%; height: 5.6%; min-width: 22px; min-height: 26px; transform: translate(-50%, -50%); background: none; border: 0; padding: 0; z-index: 2; cursor: pointer; border-radius: 3px; }
.mp-hit:focus-visible { outline: 2px solid #f6c96d; outline-offset: 2px; }
.mp-tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); white-space: nowrap; padding: 5px 8px 6px; background: #0b0d16; color: #eef0f8;
  font: 400 .66rem/1.2 "Silkscreen", var(--f-mono); letter-spacing: .04em; box-shadow: 0 0 0 1px #05070e, inset 0 0 0 1px #4a5674, 3px 3px 0 rgba(0,0,0,.45);
  opacity: 0; pointer-events: none; transition: opacity .12s steps(2), transform .12s steps(2); z-index: 5; }
.mp-tip b { color: #f6c96d; font-weight: 700; }
.mp-hit:hover .mp-tip, .mp-hit:focus-visible .mp-tip, .mp-hit.on .mp-tip { opacity: 1; transform: translate(-50%, 0); }
.mp-hit.on { z-index: 4; }
.map:hover .mp-hit.on:not(:hover) .mp-tip { opacity: 0; }
.mp-hit:hover { z-index: 6; }
.mp-hit.on .mp-tip { bottom: calc(100% + 12px); background: #f6c96d; color: #1b1406; box-shadow: 0 0 0 1px #05070e, inset 0 0 0 1px #fff0c2, 3px 3px 0 rgba(0,0,0,.5); }
.mp-hit.on .mp-tip b { color: #6a3d00; }
.mp-hit.tip-l .mp-tip { left: auto; right: 0; transform: translate(0, 4px); }
.mp-hit.tip-l:hover .mp-tip, .mp-hit.tip-l.on .mp-tip, .mp-hit.tip-l:focus-visible .mp-tip { transform: translate(0, 0); }
.mp-hit.tip-r .mp-tip { left: 0; transform: translate(0, 4px); }
.mp-hit.tip-r:hover .mp-tip, .mp-hit.tip-r.on .mp-tip, .mp-hit.tip-r:focus-visible .mp-tip { transform: translate(0, 0); }
.mp-hit.tip-b .mp-tip, .mp-hit.tip-b.on .mp-tip { bottom: auto; top: calc(100% + 6px); }
.map-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-family: "Silkscreen", var(--f-mono); font-size: .68rem; letter-spacing: .04em; }
.map-legend span { display: inline-flex; align-items: center; gap: 7px; }
.lg-pin { width: 13px; height: 17px; image-rendering: pixelated; flex: none; }
.map-go { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
@media (max-width: 640px) { .map-hud { padding: 4px 6px 5px; } .mh-t { font-size: .74rem; } .mh-s { font-size: .54rem; } .mp-tip { font-size: .58rem; } }

/* ---------- formulaires, fenêtres ---------- */
.form { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.form label { font-size: .86rem; color: var(--muted); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.form-row > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .92rem; padding: 3px 0; cursor: pointer; }
.check.off { opacity: .5; cursor: not-allowed; }
.modal-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(3,5,10,.74); display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--bg2); border: 1px solid #44527a; border-radius: 10px; width: min(580px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.65); }
.modal-wide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 1.2rem; }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.decide { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.decide-opt { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--bg3); border: 1px solid var(--line2); border-radius: var(--r); padding: 11px 14px; }
.decide-opt:hover:not(:disabled) { border-color: var(--amber); }
.decide-opt:disabled { opacity: .45; }
.decide-opt.danger strong { color: #f0a594; }
.quote { font: italic 1.02rem/1.55 var(--f-doc); color: #ece4d0; border-left: 3px solid var(--amber); padding-left: 12px; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 6px; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--bg3); border: 1px solid #4c5d80; border-left: 4px solid var(--amber); border-radius: var(--r); padding: 10px 12px; font-size: .9rem; box-shadow: 0 8px 20px rgba(0,0,0,.55); animation: tin .25s ease-out; }
.t-bad { border-left-color: var(--bad); } .t-warn { border-left-color: var(--warn); } .t-good { border-left-color: var(--ok); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

/* ---------- scènes ---------- */
.scene-host { flex: 1; padding-block: 12px 40px; padding-left: var(--gut); padding-right: var(--gut-r); min-width: 0; }
.scene-top { margin-bottom: 8px; min-height: 14px; }
.scene { min-width: 0; }
.mini-stage { width: 100%; border-radius: 6px; overflow: hidden; background: #080b13; }
.call-scene { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
.call-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; position: sticky; top: 80px; min-width: 0; }
.call-side .portrait { box-shadow: 0 0 0 3px #2b3550; }
.patience { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.call-main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.transcript { background: #070a12; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; font: 400 1rem/1.65 var(--f-mono); max-height: 58vh; overflow-y: auto; min-width: 0; }
.tline { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; margin-bottom: 10px; }
.tl-who { color: var(--amber); padding-top: 5px; overflow: hidden; text-overflow: ellipsis; }
.tl-body { min-width: 0; overflow-wrap: anywhere; }
.who-you .tl-who { color: var(--link); }
.who-you .tl-body { color: #c2d4f2; }
.who-sys .tl-body { color: var(--muted); font-style: italic; }
.who-president .tl-who, .who-jld .tl-who, .who-ji .tl-who { color: var(--amber-2); }
.who-parquet .tl-who { color: #e79a86; }
.who-adverse .tl-who { color: #e2a0d6; }
.who-client .tl-who, .who-opj .tl-who, .who-prevenu .tl-who, .who-victime .tl-who, .who-temoin .tl-who { color: #9fd0ae; }
.who-greffier .tl-who, .who-huissier .tl-who { color: #a8b3c8; }
.live .tl-body { color: #fff7e0; }
.noteable { cursor: pointer; }
.noteable:hover { background: rgba(226,164,59,.2); }
.transcript .seg-noted { background: rgba(200,184,228,.25); box-shadow: none; color: #f2eaff; }
.cut { color: var(--bad); font-size: .8rem; margin-left: 6px; }
.questions { display: flex; flex-direction: column; gap: 6px; }
.q-btn { display: flex; justify-content: space-between; gap: 10px; text-align: left; background: var(--bg2); border: 1px solid var(--line2); border-radius: var(--r); padding: 9px 12px; width: 100%; }
.q-btn:hover:not(:disabled) { border-color: var(--amber); background: var(--bg3); }
.q-btn .small { white-space: nowrap; }
.q-end { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.advice, .closing { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

.neg-scene { display: flex; flex-direction: column; gap: 14px; }
.neg-stage .scene-canvas { width: min(100%, 640px); margin: 0 auto; border-radius: 6px; }
.neg-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 390px); gap: 18px; align-items: start; }
.neg-talk { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.neg-hist { background: #070a12; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-family: var(--f-mono); max-height: 36vh; overflow-y: auto; }
.nh-you .pix { color: var(--link); } .nh-client .pix { color: var(--amber); }
.neg-hist p { margin-bottom: 8px; }
.neg-form { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.neg-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.draft-scene { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 350px); gap: 18px; align-items: start; }
.draft-doc { min-width: 0; }
.draft-bar { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; }
.draft-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 80px; min-width: 0; }
.slot-panel { display: flex; flex-direction: column; gap: 8px; }
.slot { font: inherit; border: 0; border-bottom: 2px dashed #8e7a4e; background: rgba(226,164,59,.16); color: #5a4417; padding: 0 4px; border-radius: 2px; text-align: left; }
.slot.filled { background: rgba(39,64,122,.1); color: #13306a; border-bottom-style: solid; border-bottom-color: #3c5f9c; }
.slot.on { box-shadow: 0 0 0 2px var(--amber); }
.auto { color: var(--ink); }
.draft-checks { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--paper-2); }
.draft-checks .check { color: var(--ink); font-family: var(--f-doc); }
.draft-checks .check .muted { color: var(--ink-2); }
.choices { display: flex; flex-direction: column; gap: 6px; }
.choice { text-align: left; background: var(--bg3); border: 1px solid var(--line2); border-radius: var(--r); padding: 9px 12px; font-size: .94rem; }
.choice:hover { border-color: var(--amber); }
.choice.on { border-color: var(--amber); background: #2e2716; }
.draft-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }

/* ---------- garde à vue ---------- */
.gav-scene { display: flex; flex-direction: column; gap: 12px; }
.gav-head { display: flex; flex-direction: column; gap: 8px; }
.gav-head .mini-stage { max-width: 640px; }
.gav-steps { display: flex; flex-wrap: wrap; gap: 4px; }
.gav-step { font: 400 calc(9px * var(--tz))/1 var(--f-pix); letter-spacing: .06em; text-transform: uppercase; padding: 5px 7px; border-radius: 3px; border: 1px solid var(--line2); color: var(--dim); }
.gav-step.on { color: var(--amber-ink); background: var(--amber); border-color: var(--amber-2); }
.gav-step.done { color: var(--ok); border-color: #2f5a44; }
.gav-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); gap: 16px; align-items: start; }
.gav-main { min-width: 0; }
.gav-side { position: sticky; top: 80px; min-width: 0; }
.gav-card { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; }
.gav-card > .docview, .gav-card > .transcript, .gav-card > .paper, .gav-card > .questions, .gav-card > .decide { width: 100%; }
.entretien-head { display: flex; justify-content: space-between; width: 100%; align-items: center; }
.chrono { font: 700 1.1rem/1 var(--f-mono); color: var(--ok); }
.chrono.urgent { color: var(--bad); }

/* ---------- audience ---------- */
.court-scene { display: flex; flex-direction: column; gap: 12px; }
.court-stage { position: relative; display: flex; justify-content: center; background: #0b0906; border-radius: 6px; overflow: hidden; }
.court-stage .scene-canvas { width: min(100%, 720px); }
.court-stage .pano { margin: 0 auto; }
.jury-stage { grid-column: 1 / -1; }
.neg-stage { max-width: 640px; margin-inline: auto; border-radius: 6px; overflow: hidden; background: #080b13; }
.delibere-wait { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; background: var(--bg2); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 8px; padding: 12px 14px; }
.delibere-wait .pix { color: var(--amber); }
.court-title { position: absolute; left: 12px; top: 10px; display: flex; flex-direction: column; text-shadow: 0 1px 2px #000; max-width: 60%; }
.court-title .pix { color: #f4e4bd; font-size: calc(11px * var(--tz)); }
.court-title .small { color: #e2d8c2; }
.court-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, 380px); gap: 14px; align-items: start; }
.court-log { max-height: 56vh; }
.court-log .tline { grid-template-columns: 150px minmax(0, 1fr); }
.caret { animation: blink 1s steps(1) infinite; color: var(--amber); }
@keyframes blink { 50% { opacity: 0; } }
.court-controls { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 80px; min-width: 0; }
.court-btns { display: flex; flex-direction: column; gap: 8px; }

.frise-wrap { padding: 8px 12px 12px; color: var(--seyes-ink); }

.dside { display: flex; flex-direction: column; gap: 0; width: 100%; min-width: 0; }
.dside-tabs { display: flex; gap: 4px; }
.dtab { flex: 1; background: var(--bg2); border: 1px solid var(--line2); border-bottom: 0; color: var(--muted); border-radius: var(--r) var(--r) 0 0; padding: 7px 8px; font: 400 calc(10px * var(--tz))/1 var(--f-pix); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }

.cite-in { display: flex; flex-direction: column; gap: 6px; background: var(--bg3); border: 1px solid var(--amber); border-radius: var(--r); padding: 10px; color: var(--fg); }

/* ---------- petits écrans ---------- */
@media (max-width: 1000px) {
  .call-scene, .draft-scene, .neg-body, .court-body, .jury-scene, .gav-body, .menu-grid { grid-template-columns: minmax(0, 1fr); }
  .call-side, .draft-side, .court-controls, .gav-side { position: static; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .mail-list { max-height: 40vh; }
}
@media (max-width: 760px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: auto; bottom: 0; order: 2; flex-direction: row; overflow-x: auto; border-right: 0; border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-left, 0px)) max(4px, env(safe-area-inset-bottom, 0px)); z-index: 18; background: #090d17; }
  .rail-btn { flex-direction: column; gap: 2px; font-size: .68rem; padding: 6px 8px; min-width: 66px; align-items: center; }
  .badge { position: absolute; top: 2px; right: 4px; margin: 0; }

  .hud { gap: 8px 16px; position: static; }
  .hud-reps { display: none; }

  .cal-cell { min-height: 54px; }
  .cal-ev, .cal-hol { display: none; }
  .cal-cell:has(.cal-ev)::after { content: "•"; color: var(--amber); }
  .new-career { grid-template-columns: minmax(0, 1fr); }
  .court-log .tline, .transcript .tline { display: block; margin-bottom: 12px; }
  .tl-who { display: block; padding-top: 0; font-size: calc(9px * var(--tz)); }
  .court-title { position: static; padding: 8px 10px; max-width: none; }
  .court-stage { flex-direction: column; }
  .deb-list li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .cap-box { grid-template-columns: minmax(0, 1fr); }
  .cap-left { border-right: 0; border-bottom: 1px solid var(--ink); }
  .paper-note { padding-left: 52px; }
}
/* ---------------------------------------------------------------- Écran titre : nocturne en pixel art */
.ts { position: fixed; inset: 0; overflow: hidden; background: #05081a; color: var(--fg); }
.ts-canvas { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); image-rendering: crisp-edges; image-rendering: pixelated; pointer-events: none; animation: ts-fade 1.6s ease-out both; }
.ts-panel > * { animation: ts-rise .9s cubic-bezier(.2,.8,.2,1) both; }
.ts-panel > *:nth-child(2) { animation-delay: .35s; }
.ts-panel > *:nth-child(3) { animation-delay: .6s; }
.ts-head > * { animation: ts-rise .9s cubic-bezier(.2,.8,.2,1) both; }
.ts-head > *:nth-child(2) { animation-delay: .15s; } .ts-head > *:nth-child(3) { animation-delay: .25s; } .ts-head > *:nth-child(4) { animation-delay: .4s; }
@keyframes ts-fade { from { opacity: 0; filter: brightness(.3); } to { opacity: 1; filter: none; } }
@keyframes ts-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.ts-ui { position: absolute; inset: 0; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start;
  padding-block: calc(env(safe-area-inset-top, 0px) + 26px) calc(env(safe-area-inset-bottom, 0px) + 26px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ts-ui::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 62vh; pointer-events: none; background: linear-gradient(180deg, rgba(4,6,16,.72), rgba(4,6,16,.35) 55%, rgba(4,6,16,0)); }
.ts-panel { position: relative; width: min(540px, 100%); display: flex; flex-direction: column; gap: 16px; }
.ts-head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.ts-emblem { display: block; filter: drop-shadow(0 0 10px rgba(243,193,102,.35)); animation: ts-sway 5s ease-in-out infinite; transform-origin: 50% 8%; }
.ts-eyebrow { margin: 0; font: 400 calc(11px * var(--tz))/1.2 "Silkscreen", var(--f-mono); letter-spacing: .22em; text-transform: uppercase; color: #9fb4dc; text-shadow: 0 2px 0 #000; }
.ts-title { margin: 0; font-family: "Silkscreen", var(--f-mono); font-weight: 700; font-size: clamp(2.3rem, 9vw, 4.6rem); line-height: .92; color: #f6c96d; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance;
  text-shadow: 0 .06em 0 #c27a22, 0 .12em 0 #7a4314, 0 .18em 0 #2b1607, 0 0 .55em rgba(246,201,109,.38); animation: ts-neon 9s infinite; }
.ts-title span { display: block; font-size: .4em; letter-spacing: .34em; color: #9fb4dc; text-shadow: 0 .14em 0 #27407a, 0 0 .5em rgba(159,180,220,.3); margin-bottom: .18em; }

  input, select, textarea { font-size: calc(16px * var(--tz)); }

  .court-log { font-size: calc(15px * var(--tz)); line-height: 1.55; }

  .court-dossier { box-shadow: none; padding: 0; background: none; }

  /* carnet escamotable */
  .dside-fab { position: fixed; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border: 0; background: var(--amber); color: #1d1406; font-size: calc(11px * var(--tz)); letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 0 0 2px #1d1406, 0 6px 16px rgba(0,0,0,.5); }
  .dside-backdrop { position: fixed; inset: 0; z-index: 44; background: rgba(4, 6, 14, .6); }
  .dside-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; max-height: 82vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); padding: 8px 12px calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -2px 0 var(--px-line), 0 -12px 30px rgba(0,0,0,.6); animation: dside-up .18s ease-out; }
  .dside-sheet-head { position: sticky; top: -8px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; background: var(--bg); color: var(--amber-2); font-size: calc(11px * var(--tz)); letter-spacing: .08em; text-transform: uppercase; }

@keyframes dside-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* =====================================================================================================================
   Version 1.0 — lisibilité. Les textes de droit restent en Spectral (esprit code annoté) ; l'interface et tout ce qui
   se dit (entretiens, auditions, audiences) passent en Source Sans 3. Qui parle se voit : une couleur et un filet
   par voix. La taille suit le réglage « Taille du texte » (variable --tz, prefs.js).
   ===================================================================================================================== */
.pix { font-size: calc(11px * var(--tz)); }
.paper { font-size: 1.06rem; line-height: 1.7; max-width: 74ch; }
.paper-pv { font-size: 1rem; }
.paper-title { font-size: 1.1rem; }
.paper-releve p { font-size: .92rem; }
.paper p { hyphens: auto; }
.transcript { font: 400 1.06rem/1.6 var(--f-ui); padding: 14px 14px 14px 10px; }
.tline { grid-template-columns: minmax(84px, 7.2em) minmax(0, 1fr); gap: 12px; margin-bottom: 8px; padding: 5px 10px 5px 10px; border-left: 3px solid var(--who, transparent); border-radius: 0 4px 4px 0; --who: #46536e; }
.tl-who.pix { font: 700 calc(11.5px * var(--tz))/1.3 var(--f-ui); letter-spacing: .07em; color: var(--who); padding-top: 4px; white-space: nowrap; }
.who-you { --who: #7fa8ea; background: rgba(104, 146, 220, .09); }
.who-you .tl-who.pix { color: var(--who); }
.who-you .tl-body { color: #d6e3f8; }
.who-sys { --who: transparent; padding-block: 2px; }
.who-sys .tl-body { font-size: .95rem; }
.who-president, .who-jld, .who-ji, .who-juge, .who-assesseur { --who: var(--amber-2); }
.who-parquet { --who: #ee9079; }
.who-adverse, .who-confrere { --who: #e2a0d6; }
.who-client, .who-prevenu { --who: #8fd3a5; }
.who-victime, .who-temoin, .who-famille, .who-expert { --who: #7fd0cf; }
.who-opj, .who-escorte { --who: #b9c4dc; }
.who-greffier, .who-huissier { --who: #98a3ba; }
.who-president .tl-who.pix, .who-jld .tl-who.pix, .who-ji .tl-who.pix, .who-parquet .tl-who.pix, .who-adverse .tl-who.pix, .who-client .tl-who.pix, .who-opj .tl-who.pix, .who-prevenu .tl-who.pix, .who-victime .tl-who.pix, .who-temoin .tl-who.pix, .who-greffier .tl-who.pix, .who-huissier .tl-who.pix { color: var(--who); }
.live { background: rgba(243, 193, 102, .07); }
.live .tl-body { color: #fff7e0; }
.choice, .q-btn { font-size: 1rem; line-height: 1.45; }
.small { font-size: .88rem; }
.mail-subj { font-size: .94rem; }
@media (max-width: 760px) { .tline { grid-template-columns: 1fr; gap: 0; } .tl-who.pix { padding-top: 0; } }
/* Ce sur quoi on clique et ce qu'on lit en passant (boutons, navigation, onglets, étiquettes) quitte la police pixel :
   elle reste pour les titres et les mots courts du décor, là où elle fait l'identité du jeu sans coûter à la lecture. */
.btn, .rail-btn, .tab, .dtab, .chip, .tag, .mood, .kind, .badge, .gav-step, .dir, .deb-k, .parole, .ts-btn, .ts-box-title, .pl-partie, .arg-n,
.sub-head, .form label, .tbl th, .cal-dow { font-family: var(--f-ui); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
.btn { font-size: calc(12.5px * var(--tz)); }
.btn-sm { font-size: calc(11.5px * var(--tz)); }
.rail-btn { font-size: calc(12.5px * var(--tz)); letter-spacing: .09em; }
.tab, .dtab { font-size: calc(12px * var(--tz)); }
.chip { font-size: calc(12px * var(--tz)); text-transform: none; letter-spacing: .02em; font-weight: 600; }
.tag, .mood, .kind, .gav-step, .dir, .deb-k, .pl-partie { font-size: calc(10.5px * var(--tz)); }
.badge { font-size: calc(11px * var(--tz)); letter-spacing: 0; }
.parole { font-size: calc(14px * var(--tz)); letter-spacing: .12em; }
.ts-btn { font-size: calc(15px * var(--tz)); letter-spacing: .1em; }
.ts-btn small { font-family: var(--f-ui); text-transform: none; letter-spacing: 0; font-weight: 400; }
.ts-box-title { font-size: calc(14px * var(--tz)); }
.sub-head, .form label, .tbl th, .cal-dow { font-size: calc(11px * var(--tz)); }
h3 { font: 700 calc(13.5px * var(--tz))/1.35 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; }
.paper h3, .paper-title, .lv-page h3 { letter-spacing: .05em; }
.reglages { box-sizing: border-box; }
.hud-time, .hud-money .num { font-family: var(--f-ui); font-weight: 700; font-variant-numeric: tabular-nums; font-size: calc(16px * var(--tz)); letter-spacing: .02em; }
@media (max-width: 760px) { .rail-btn { font-size: calc(9.5px * var(--tz)); letter-spacing: .02em; } .btn { font-size: calc(12.5px * var(--tz)); } .tab, .dtab { font-size: calc(11.5px * var(--tz)); } .ts-btn { font-size: calc(14px * var(--tz)); } }
/* Plaidoirie : le ton, le plan dans l'ordre, la réplique */
.ton-pick { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.tonb { background: var(--bg3); border: 0; box-shadow: inset 0 0 0 2px var(--line2); padding: 6px 12px; font: 600 .9rem/1.2 var(--f-ui); color: var(--muted); }
.tonb:hover { color: var(--fg); box-shadow: inset 0 0 0 2px var(--px-hi); }
.tonb.on { background: #2e2716; color: var(--amber-2); box-shadow: inset 0 0 0 2px var(--amber); }
.plan-ord { margin: 0; padding: 8px 10px 8px 30px; background: var(--paper); color: var(--ink); font: .92rem/1.4 var(--f-doc); display: flex; flex-direction: column; gap: 4px; }
.plan-ord li { padding-left: 2px; }
.plan-ord li::marker { font-weight: 700; color: var(--bleu); }
.plan-ord li > span { vertical-align: top; }
.plan-b { float: right; display: inline-flex; gap: 2px; margin-left: 8px; }
.plan-mv { border: 0; background: #e7e1d1; color: var(--ink); width: 26px; height: 24px; padding: 0; font-size: 11px; line-height: 1; }
.plan-mv:disabled { opacity: .3; }
.plan-mv:hover:not(:disabled) { background: var(--bleu); color: #fff; }
.replique .choice { display: flex; flex-direction: column; gap: 2px; }
/* Mini cas pratique (révision CRFPA) */
.cas-pratique { margin: 12px 4px 4px; padding: 12px 14px 14px; background: #101a30; color: var(--fg); box-shadow: inset 0 0 0 2px #3c5f9c, inset 0 0 0 4px #101a30, inset 0 0 0 6px #1c2a4a; font: 400 1rem/1.5 var(--f-ui); }
.paper-note .cas-pratique { margin: 10px 0 14px -14px; }
.cas-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.cas-titre { font: 700 calc(13px * var(--tz))/1.3 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: #9fc0f0; }
.cas-score { font: 700 .95rem/1 var(--f-ui); color: var(--amber-2); font-variant-numeric: tabular-nums; }
.cas-score.tout { color: var(--ok); }
.cas-head .link { margin-left: auto; }
.cas-rappel { margin: 0 0 8px; font: italic 400 .98rem/1.5 var(--f-doc); color: #cdd6ea; max-width: 72ch; }
.cas-q { padding: 8px 0 10px; border-top: 1px dashed #2c3f66; }
.cas-q p { margin: 0 0 6px; }
.cas-t { font-weight: 700; color: #cfe0fb; }
.cas-n { display: inline-block; min-width: 20px; height: 20px; margin-right: 8px; text-align: center; font: 700 .8rem/20px var(--f-ui); background: #3c5f9c; color: #fff; }
.cas-enonce { font: 400 1.04rem/1.6 var(--f-doc); color: #f0eadb; max-width: 72ch; }
.cas-opts { display: flex; flex-direction: column; gap: 6px; }
.cas-opt { text-align: left; background: var(--bg2); border: 0; box-shadow: inset 0 0 0 2px var(--line2); padding: 9px 12px; font: 400 .98rem/1.45 var(--f-doc); color: var(--fg); }
.cas-opt:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--amber); }
.cas-opt:disabled { cursor: default; opacity: .75; }
.cas-opt.bonne { box-shadow: inset 0 0 0 2px var(--ok); background: #14251e; opacity: 1; }
.cas-opt.fausse { box-shadow: inset 0 0 0 2px var(--bad); background: #2b1614; opacity: 1; }
.cas-corr { margin-top: 8px !important; padding-left: 10px; border-left: 3px solid var(--ok); font: 400 .98rem/1.55 var(--f-doc); max-width: 72ch; }
.cas-corr.ko { border-left-color: var(--bad); }
.cas-fin { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }
.cas-bilan { margin: 0 0 10px; color: var(--muted); }
.cas-bilan strong { color: var(--amber-2); }
.fiche-revision.paper-note { font: 400 1.04rem/32px var(--f-doc); color: #1d2440; }
.fiche-revision.paper-note .fr-h { font-family: var(--f-ui); font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: var(--bleu); }
/* Carrière : grades, objectifs, spécialité */
.car-tete { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr); gap: 14px 24px; align-items: center; margin-bottom: 14px; padding: 14px 16px; background: var(--bg2); box-shadow: inset 0 0 0 2px var(--line); }
.car-tete > div { display: flex; flex-direction: column; gap: 4px; }
.car-grade { font: 700 1.5rem/1.15 var(--f-title); color: var(--amber-2); }
.car-echelle { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; counter-reset: g; }
.car-echelle li { counter-increment: g; flex: 1 1 120px; padding: 7px 8px; font: 600 calc(12px * var(--tz))/1.25 var(--f-ui); color: var(--dim); background: var(--bg); box-shadow: inset 0 0 0 1px var(--line2); }
.car-echelle li::before { content: counter(g) ". "; }
.car-echelle li.fait { color: var(--ok); box-shadow: inset 0 0 0 1px #2f5a44; }
.car-echelle li.ici { color: var(--amber-ink); background: var(--amber); box-shadow: none; }

.dr-fig { margin: 0.6em 0 1em; text-align: center; } .dr-fig figcaption { font-size: 0.8em; color: #45423c; margin-top: 0.3em; }

@media (max-width: 860px) { .dr { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .dr-rail { max-height: 30vh; border-right: 0; } }

/* ---- Lecteur en feuillets ouvert depuis un dossier, schéma corporel dans une pièce ---- */
.doc-lire { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.dr-video { margin: 8px 0 14px; }
.pv-schema { margin: 10px 0 14px; display: flex; gap: 14px; align-items: flex-start; }

.pv-schema figcaption { font: .78rem/1.4 var(--f-ui); color: var(--ink-2); }

/* ---- Capture de caméra du pilote des violences dans une pièce ---- */
.pv-capture { margin: 6px 0 14px; display: grid; gap: 4px; }
.pv-capture canvas { width: 100%; max-width: 480px; aspect-ratio: 4 / 3; background: #050607; image-rendering: pixelated; }
.pv-capture figcaption { font: .76rem/1.3 var(--f-ui); color: var(--ink-2); }

/* ---------- dossier de travail (lot 2) : annotations, marges, plan, chronologie ---------- */
.paper mark.an { color: inherit; padding: 0 1px; border-radius: 2px; cursor: pointer; }
.an-charge { background: rgba(214, 74, 60, .30); box-shadow: inset 0 -2px 0 rgba(168, 40, 30, .55); }
.an-decharge { background: rgba(70, 168, 92, .30); box-shadow: inset 0 -2px 0 rgba(36, 120, 58, .55); }
.an-procedure { background: rgba(70, 120, 214, .28); box-shadow: inset 0 -2px 0 rgba(36, 72, 168, .55); }
.an-verifier { background: rgba(250, 210, 60, .45); box-shadow: inset 0 -2px 0 rgba(170, 130, 20, .5); }
.paper mark.an-noted { text-decoration: underline dotted; text-underline-offset: 3px; }
.an-marge { font: 500 1.08rem/1.25 "Caveat", var(--f-ui); color: #23306e; margin: -.45em 0 .8em 1.4em; padding-left: 8px; border-left: 3px solid currentColor; background: none !important; box-shadow: none !important; }
.an-marge.an-charge { color: #8a2218; } .an-marge.an-decharge { color: #1f6a34; } .an-marge.an-procedure { color: #23306e; } .an-marge.an-verifier { color: #7a5a08; }
.pop .nchip.an-chip { color: #1d1d22; border-color: transparent; }
.pop .nchip.an-chip.on, .travail .nchip.an-chip.on { outline: 2px solid #1d1d22; outline-offset: 1px; color: #1d1d22; }
.pop-coul { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 12px 2px; }
.pop-travail .pop-quote { padding: 8px 12px 0; }
.pop-actions { display: flex; flex-direction: column; }
.pop-form input[type=text], .pop-form input[type=date], .pop-form input[type=time] { background: var(--bg2); color: inherit; border: 1px solid var(--line2); font: .84rem var(--f-ui); padding: 4px 6px; }
.pop-form input[type=text] { width: 100%; }
.travail .nchip { display: inline-block; padding: 3px 8px; font-size: .74rem; border: 1px solid var(--line2); border-radius: 99px; background: var(--bg2); color: inherit; }
.travail .nchip.on { background: #8a1c1c; border-color: #8a1c1c; color: #fff; }
.an-list { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-direction: column; gap: 10px; }
.an-list > li { background: var(--bg2); border: 1px solid var(--line2); padding: 8px 10px; }
.an-cite { padding: 0 3px; }
.travail .an-cite, .travail .v-cell { color: #f3ecda; }
.an-list .an-marge { margin: 6px 0 0 4px; color: #e7dcc0 !important; }
.an-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.an-vs { margin: 0 4px; color: var(--muted); }
.chrono-list { list-style: none; padding: 0; margin: 8px 0; border-left: 2px solid var(--line2); color: #f3ecda; }
.travail .an-list > li, .travail .moyen, .travail .versions { color: #f3ecda; }
.chrono-list > li { position: relative; padding: 4px 0 4px 14px; }
.chrono-list > li::before { content: ""; position: absolute; left: -5px; top: 11px; width: 8px; height: 8px; background: var(--amber); }
.chrono-quand { font-weight: 700; font-variant-numeric: tabular-nums; }
.chrono-ecart { color: var(--amber); margin: 0 0 2px; font-variant-numeric: tabular-nums; }
.chrono-ajout { flex-wrap: wrap; margin-top: 8px; }
.versions-wrap { overflow-x: auto; }
.versions th, .versions td { vertical-align: top; text-align: left; min-width: 140px; }
.v-cell { padding: 3px 5px; margin-bottom: 4px; color: var(--ink); }
.plan-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 8px 0; }
@media (max-width: 760px) { .plan-cols { grid-template-columns: 1fr; } }
.plan-col { background: var(--bg2); border: 1px solid var(--line2); padding: 8px; min-width: 0; }
.plan-col h4 { margin: 0 0 6px; }
.moyen { border-top: 1px solid var(--line2); padding: 6px 0; }
.moyen-cotes { margin: 4px 0; padding-left: 16px; font-size: .86rem; }
.moyen-irr { color: var(--muted); margin-top: 2px; }
.doc-row.doc-onglet { box-shadow: inset 4px 0 0 var(--amber); }
.onglet-mark { display: inline-block; width: 10px; height: 16px; background: var(--amber); margin-right: 6px; }

/* ============================================================ Refonte du gameplay, lot 3 : la parole (entretien, audition) */
.ent-parole .oral { min-height: 11.5em; max-height: 19em; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 0.45em; padding: 0.6em 0.2em; }
.oral-vide { margin: auto 0 0; color: var(--muted, #9a958a); font-style: italic; font-size: calc(14px * var(--tz)); }
.oral-l { display: grid; grid-template-columns: 5.4em 1fr; gap: 0.6em; align-items: baseline; transition: opacity 1.2s ease, filter 1.2s ease; }
.oral-l.oral-efface { opacity: 0; filter: blur(1.5px); }
.oral-who { font: 600 calc(11px * var(--tz)) var(--f-ui); letter-spacing: 0.08em; color: var(--muted, #9a958a); text-align: right; }
.oral-t { all: unset; font: calc(16px * var(--tz))/1.42 var(--f-ui); color: var(--fg, #ece6da); cursor: pointer; border-radius: 3px; padding: 0 0.15em; }
.oral-t:disabled { cursor: default; }
.oral-t:not(:disabled):hover, .oral-t:focus-visible { background: rgba(201, 164, 92, 0.16); }
.who-you .oral-t { color: #c9d4e6; font-style: italic; }
.who-sys .oral-t { color: var(--muted, #9a958a); font-style: italic; }
.who-opj .oral-t { color: #d9c9a8; }
.oral-notee .oral-t { box-shadow: inset 0 -0.14em 0 rgba(201, 164, 92, 0.7); }
.oral-caret { display: inline-block; width: 0.45em; height: 1em; margin-left: 1px; vertical-align: -0.12em; background: currentColor; opacity: 0.35; }
.ent-qclient { display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; padding: 0.4em 0.6em; border-left: 2px solid #c9a45c; background: rgba(201, 164, 92, 0.08); font-size: calc(14px * var(--tz)); }
.ent-qclient span { flex: 1; }
.ent-onglets { display: flex; gap: 0.2em; border-bottom: 1px solid rgba(255, 255, 255, 0.12); margin-top: 0.4em; }
.ent-onglet { all: unset; cursor: pointer; padding: 0.35em 0.8em; font: 600 calc(13px * var(--tz)) var(--f-ui); color: var(--muted, #9a958a); border-bottom: 2px solid transparent; }
.ent-onglet.on { color: var(--fg, #ece6da); border-bottom-color: #c9a45c; }
.ent-onglet:focus-visible { outline: 1px solid #c9a45c; }
.compo { display: grid; gap: 0.45em; padding: 0.5em 0; }
.compo-l { display: grid; grid-template-columns: 5.4em 1fr; gap: 0.6em; align-items: start; }
.compo-h { font: 600 calc(11px * var(--tz)) var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted, #9a958a); padding-top: 0.45em; text-align: right; }
.compo-l > div { display: flex; flex-wrap: wrap; gap: 0.3em; }
.compo-b { all: unset; cursor: pointer; padding: 0.28em 0.6em; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 3px; font: calc(13px * var(--tz)) var(--f-ui); color: var(--fg, #ece6da); }
.compo-b:hover:not(:disabled), .compo-b:focus-visible { border-color: rgba(201, 164, 92, 0.7); }
.compo-b.on { background: #c9a45c; border-color: #c9a45c; color: #17130c; }
.compo-b:disabled { opacity: 0.35; cursor: default; }
.compo-b kbd { font: 600 calc(10px * var(--tz)) var(--f-mono); opacity: 0.6; margin-right: 0.35em; }
.compo-l select { max-width: 100%; font: calc(13px * var(--tz)) var(--f-ui); }
.compo-go { display: flex; align-items: center; gap: 0.8em; margin-top: 0.2em; padding-top: 0.5em; border-top: 1px solid rgba(255, 255, 255, 0.08); }
.compo-q { flex: 1; margin: 0; font: italic calc(15px * var(--tz))/1.35 var(--f-ui); color: #c9d4e6; }
.ent-conseil { display: grid; gap: 0.35em; padding: 0.5em 0; }
.cons-l { display: flex; justify-content: space-between; align-items: center; gap: 0.8em; padding: 0.3em 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.cons-l > span:first-child { display: grid; } .cons-l small { color: var(--muted, #9a958a); font-size: calc(12px * var(--tz)); }
.cons-b { display: flex; gap: 0.3em; }
.ent-notes ol { margin: 0.5em 0; padding-left: 1.4em; display: grid; gap: 0.25em; font-size: calc(14px * var(--tz)); }
.ent-notes li.own { font-family: "Caveat", cursive; font-size: 1.2em; }
.ent-note-in { display: flex; gap: 0.4em; } .ent-note-in input { flex: 1; font: calc(14px * var(--tz)) var(--f-ui); }
.ent-fin { display: flex; align-items: center; justify-content: flex-end; gap: 0.6em; margin-top: 0.5em; }
.ent-fin > span { margin-right: auto; }
@media (prefers-reduced-motion: reduce) { .oral-l { transition: none; } }

/* lot 3, plan plein écran : la parole en haut, le compositeur dessous */
.staged .ent-card.ent-parole { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(4.4em, auto) auto auto; grid-template-areas: "head" "oral" "qc" "cote"; height: auto; max-height: 50vh; gap: 5px; }
.staged .ent-parole > .oral { min-height: 4.4em; max-height: 6.8em !important; }
.ent-tete-d { display: flex; align-items: center; gap: 0.8em; }
.ent-qclient span { font-style: italic; }
.staged .ent-parole > .entretien-head { grid-area: head; }
.staged .ent-parole > .oral { grid-area: oral; max-height: none; min-height: 0; background: rgba(4, 6, 11, 0.55); border-radius: 4px; padding: 0.6em 0.8em; }
.staged .ent-parole > .ent-qclient { grid-area: qc; }
.staged .ent-parole > .ent-cote { grid-area: cote; min-height: 0; overflow-y: auto; }
.staged .ent-parole > .ent-fin { grid-area: fin; }

.staged .gav-card.ent-parole:not(.ent-card) { display: flex; flex-direction: column; gap: 0.4em; max-height: 48vh; overflow-y: auto; }
.staged .gav-card.ent-parole:not(.ent-card) > .oral { background: rgba(4, 6, 11, 0.55); border-radius: 4px; padding: 0.6em 0.8em; }
@media (max-width: 900px) { .staged .ent-card.ent-parole { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "oral" "qc" "cote" "fin"; grid-template-rows: auto minmax(8em, 1fr) auto auto auto; height: 62vh; } }

/* lot 4b : le catalogue universel des moyens */
.args-cat { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 16px; max-height: 42vh; overflow-y: auto; }
.cat-rub { display: grid; gap: 4px; align-content: start; }
.cat-h { font: 600 calc(11px * var(--tz)) var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted, #9a958a); padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.args-cat .arg { text-align: left; font-size: calc(13px * var(--tz)); }

.plan-barre { margin: 4px 0 8px; padding: 6px 10px; border-left: 2px solid #c9a45c; background: rgba(201,164,92,.06); }
.plan-barre summary { cursor: pointer; font: 600 calc(13px * var(--tz)) var(--f-ui); }
.plan-barre .pb-col { display: grid; gap: 4px; margin-top: 6px; }
.plan-barre .pb-m { display: grid; gap: 2px; font-size: calc(13px * var(--tz)); }
.plan-barre .pb-c { font: italic calc(12px * var(--tz))/1.35 var(--f-doc); color: var(--muted, #b9b3a6); padding-left: 10px; }

/* lot 3 : entretiens hors garde à vue au compositeur */
.call-libre { display: grid; gap: 6px; }
.call-libre .oral { min-height: 6em; max-height: 13em; }
.gestes { display: grid; grid-template-columns: 5.4em 1fr; gap: 0.6em; align-items: start; }
.gestes > div { display: flex; flex-wrap: wrap; gap: 0.3em; }
.gestes .geste { font-style: italic; }

/* lot 5 : le canal de chaque acte */
.canaux { display: grid; gap: 6px; }
.canaux .canal { all: unset; cursor: pointer; display: grid; gap: 2px; padding: 8px 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 4px; }
.canaux .canal:hover, .canaux .canal:focus-visible { border-color: rgba(201,164,92,.7); background: rgba(201,164,92,.06); }
.ebarreau { display: grid; gap: 10px; }
.eb-annuaire { display: grid; gap: 4px; }
.eb-dest { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: baseline; padding: 6px 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 4px; cursor: pointer; }
.eb-dest .small { grid-column: 2; }
.eb-dest.on { border-color: rgba(201,164,92,.8); background: rgba(201,164,92,.08); }
.eb-objet, .eb-pj { margin: 0; }
.eb-ar { display: grid; gap: 2px; padding: 8px 12px; margin-bottom: 8px; border-left: 3px solid #6f9a6a; background: rgba(111,154,106,.08); }

/* lot 3 : l'entretien libre dans la scène d'appel en plein cadre — la parole à gauche, le compositeur à droite */
.call-scene.staged .call-main:has(> .call-libre) { height: 48vh; }
.call-scene.staged .call-libre { grid-column: 1 / -1; grid-row: 1 / -1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 1.25fr); grid-template-rows: auto auto auto minmax(0, 1fr); grid-template-areas: "oral qc" "oral compo" "oral gestes" "oral fin"; gap: 6px 14px; padding: 10px 12px; background: rgba(6, 9, 15, 0.86); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); border-radius: 4px; overflow: hidden; }
.call-scene.staged .call-libre > .oral { grid-area: oral; max-height: none; min-height: 0; }
.call-scene.staged .call-libre > .ent-qclient { grid-area: qc; }
.call-scene.staged .call-libre > .compo { grid-area: compo; overflow-y: auto; min-height: 0; padding-top: 0; }
.call-scene.staged .call-libre > .gestes { grid-area: gestes; }
.call-scene.staged .call-libre > .ent-fin { grid-area: fin; align-self: end; }
.call-scene.staged .call-libre .compo-l { grid-template-columns: 4.4em 1fr; }
.call-scene.staged .call-libre .compo-sujets .compo-b, .call-scene.staged .call-libre .compo-b { padding: 0.2em 0.5em; font-size: calc(12px * var(--tz)); }

/* e-Barreau (B1 bis) : le poste de messagerie pénale */
.ebarreau-poste { display: grid; grid-template-columns: 190px 1fr; min-height: 520px; background: #eef0f6; color: #1c2340; border-radius: 6px; overflow: hidden; font-size: calc(13px * var(--tz)); }
.eb-menu { background: #1b2340; color: #dfe4f5; display: flex; flex-direction: column; padding: 10px 0; }

.eb-m { all: unset; cursor: pointer; padding: 8px 14px; }
.eb-m.on, .eb-m:hover { background: rgba(255,255,255,.08); box-shadow: inset 3px 0 0 #d8403c; }
.eb-quit { margin-top: auto; opacity: .8; }
.eb-main { padding: 18px 22px; overflow: auto; }
.eb-main h3 { margin: 0 0 6px; color: #1b2340; } .eb-main h4 { margin: 14px 0 6px; color: #1b2340; }
.eb-tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
.eb-tuile { all: unset; display: grid; gap: 4px; padding: 18px 14px; background: #2b3563; color: #f2f4fb; border-radius: 6px; text-align: center; cursor: default; }
button.eb-tuile { cursor: pointer; } .eb-tuile b { font-size: 1.6em; }
.eb-card { background: #fff; border-radius: 6px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.12); max-width: 780px; position: relative; }
.eb-dests { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; border-bottom: 1px solid #c9cfe0; padding: 6px 0; margin-bottom: 6px; }
.eb-dests > .small { grid-column: 1 / -1; color: #3d64c9; }
.eb-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.eb-chip button { all: unset; cursor: pointer; padding: 0 4px; }
.eb-adr { border: none; outline: none; min-width: 160px; background: transparent; color: inherit; }
.eb-annu-b { all: unset; cursor: pointer; color: #3d64c9; font-size: .9em; }
.eb-f { display: grid; gap: 2px; } .eb-f .small { color: #3d64c9; }
.eb-f input, .eb-f select, .eb-annu select, .eb-q { border: none; border-bottom: 1px solid #c9cfe0; background: transparent; padding: 4px 0; color: #1c2340; font: inherit; }
.eb-objet { margin: 6px 0; }
.eb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 14px; }
.eb-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.eb-gen-h { display: flex; justify-content: space-between; margin: 10px 0 4px; gap: 8px; flex-wrap: wrap; }
.eb-gen { background: #f6f7fb; border: 1px solid #dde1ee; padding: 10px; white-space: pre-wrap; font: inherit; margin: 0; }
.eb-pj { display: grid; gap: 4px; margin: 10px 0; } .eb-pj > .small { color: #3d64c9; }
.eb-conf { display: block; margin-top: 8px; }
.eb-annu { position: absolute; inset: 10px; z-index: 5; background: #fff; border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.25); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.eb-annu-head { display: flex; justify-content: space-between; } .eb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.eb-annu-t { margin: 4px 0 0; color: #b8322f; font-size: .9em; text-decoration: underline; }
.eb-annu-list { flex: 1; overflow: auto; display: grid; gap: 4px; align-content: start; }
.eb-annu-l { all: unset; cursor: pointer; display: grid; grid-template-columns: 1.2fr 1.4fr .6fr; gap: 8px; padding: 8px 10px; border: 1px solid #e1e4ee; border-radius: 4px; }
.eb-annu-l.on { background: #dfe7fb; border-color: #3d64c9; }
.eb-annu-foot { display: flex; justify-content: flex-end; gap: 8px; }
.eb-liste-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.eb-tbl { background: #fff; color: #1c2340; } .eb-tbl tr { cursor: pointer; } .eb-tbl tr:hover td { background: #f1f3fa; } .eb-nonlu td { font-weight: 600; }
.eb-lect-h { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.eb-modal .modal-body, .eb-modal { max-width: min(1100px, 96vw); }
